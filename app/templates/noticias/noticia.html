{% extends "base.html" %}
{% block conteudo %}
<div class="card p-4">
    <h3 class="mb-3">Notícias Publicadas</h3>

    <a href="{{ url_for('noticias_cadastrar') }}" class="btn btn-primary mb-3">
        Nova Notícia
    </a>

    <ul class="list-group">
        {% for n in noticias %}
        <li class="list-group-item d-flex justify-content-between">
            <div>
                <strong>{{ n.titulo }}</strong>
                <br>
                <small>{{ n.data_publicacao.strftime('%d/%m/%Y %H:%M') }}</small>
            </div>

            <form method="POST" action="{{ url_for('noticias_delete', id=n.id) }}">
                <button class="btn btn-danger btn-sm">Excluir</button>
            </form>
        </li>
        {% endfor %}
    </ul>

</div>
{% endblock %}
