{% extends "base.html" %}
{% block titulo %}Usuários - SIGP{% endblock %}

{% block conteudo %}

<div class="d-flex justify-content-between align-items-center mb-3">
    <h3 class="text-primary"><i class="fa-solid fa-users me-2"></i>Usuários</h3>
    <a href="{{ url_for('usuarios_cadastrar') }}" class="btn btn-primary">
        <i class="fa-solid fa-user-plus me-1"></i> Novo Usuário
    </a>
</div>

<div class="card shadow">
    <div class="card-body">

        <table class="table table-hover align-middle">
            <thead class="table-primary">
                <tr>
                    <th>ID</th>
                    <th>Usuário</th>
                    <th>Email</th>
                    <th></th>
                </tr>
            </thead>

            <tbody>
                {% for u in usuarios %}
                <tr>
                    <td>{{ u.id }}</td>
                    <td>{{ u.username }}</td>
                    <td>{{ u.email }}</td>

                    <td class="text-end">
                        <a href="{{ url_for('usuarios_edit', id=u.id) }}" 
                           class="btn btn-sm btn-warning me-2">
                            <i class="fa-solid fa-pen"></i>
                        </a>

                        <a href="{{ url_for('usuarios_delete', id=u.id) }}"
                           class="btn btn-sm btn-danger">
                            <i class="fa-solid fa-trash"></i>
                        </a>
                    </td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="4" class="text-center text-muted">
                        Nenhum usuário cadastrado.
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>

    </div>
</div>

{% endblock %}
