{% extends "base.html" %}
{% block titulo %}Secretarias - SIGP{% endblock %}

{% block conteudo %}

<div class="d-flex justify-content-between align-items-center mb-3">
    <h3 class="text-primary">
        <i class="fa-solid fa-building-columns me-2"></i>
        Secretarias
    </h3>

    <a href="{{ url_for('secretarias_cadastrar') }}" class="btn btn-primary">
        <i class="fa-solid fa-plus me-1"></i> Nova Secretaria
    </a>
</div>

<div class="card shadow">
    <div class="card-body">

        <table class="table table-hover align-middle">
            <thead class="table-primary">
                <tr>
                    <th>Nome</th>
                    <th>Descrição</th>
                    <th class="text-end">Ações</th>
                </tr>
            </thead>

            <tbody>
                {% for sec in secretarias %}
                <tr>
                    <td>{{ sec.nome }}</td>
                    <td>{{ sec.descricao or '-' }}</td>

                    <td class="text-end">

                        <a href="{{ url_for('secretarias_editar', id=sec.id) }}"
                           class="btn btn-sm btn-warning me-2">
                            <i class="fa-solid fa-pen"></i>
                        </a>

                        <a href="{{ url_for('secretarias_delete', id=sec.id) }}"
                           class="btn btn-sm btn-danger">
                            <i class="fa-solid fa-trash"></i>
                        </a>

                    </td>
                </tr>

                {% else %}
                <tr>
                    <td colspan="3" class="text-center text-muted">
                        Nenhuma secretaria cadastrada.
                    </td>
                </tr>
                {% endfor %}
            </tbody>

        </table>

    </div>
</div>

{% endblock %}
