{% extends "base.html" %}
{% block titulo %}Atividades do Sistema{% endblock %}

{% block conteudo %}
<div class="card shadow p-4">
    <h3 class="mb-4">Atividades do Sistema</h3>

    <table class="table table-hover">
        <thead class="table-primary">
            <tr>
                <th>Data</th>
                <th>Usuário</th>
                <th>Ação</th>
            </tr>
        </thead>
        <tbody>
            {% for a in atividades %}
            <tr>
                <td>{{ a.data.strftime('%d/%m/%Y %H:%M') }}</td>
                <td>{{ a.usuario }}</td>
                <td>{{ a.acao }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
