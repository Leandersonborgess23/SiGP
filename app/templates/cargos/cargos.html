{% extends "base.html" %}
{% block titulo %}Cargos - SIGP{% endblock %}
{% block conteudo %}
<h2>Cargos</h2>

<a href="{{ url_for('cargos_cadastrar') }}" class="btn btn-success mb-3">Cadastrar novo Cargo</a>

<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Descrição</th>
            <th>Ações</th>
        </tr>
    </thead>
    <tbody>
        {% for c in cargos %}
        <tr>
            <td>{{ c.id }}</td>
            <td>{{ c.nome }}</td>
            <td>{{ c.descricao or '-' }}</td>
            <td>
                <a href="{{ url_for('cargos_editar', id=c.id) }}" class="btn btn-primary btn-sm">Editar</a>

                <form method="POST" action="{{ url_for('cargos_remover', id=c.id) }}" style="display:inline;">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <button type="submit" class="btn btn-danger btn-sm">Remover</button>
                </form>
            </td>
        </tr>
        {% else %}
        <tr><td colspan="4">Nenhum cargo cadastrado.</td></tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
