<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}SIGP - Prefeitura de Pureza{% endblock %}</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/main.min.css">

    <!-- Tema azul prefeitura -->
    <style>
        :root{
            --azul-prefeitura: #0055A4;
            --azul-claro: #e8f1fb;
        }
        body { background-color: var(--azul-claro); }
        #sidebar { width: 240px; }
        #sidebar .nav-link { color: white; font-size: 15px; }
        #sidebar .nav-link:hover { background-color: rgba(255,255,255,0.2); }
        #sidebar .active { background-color: rgba(255,255,255,0.3); }
        .navbar { background-color: white !important; }
        .footer-bg { background-color: #f8f9fc; }
    </style>

    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <div class="d-flex">

        <!-- Sidebar -->
        {% include 'includes/sidebar.html' %}

        <!-- Conteúdo principal -->
        <div class="flex-grow-1">

            <!-- Navbar -->
            {% include 'includes/navbar.html' %}

            <main class="container-fluid py-4">
                {% block conteudo %}{% endblock %}
            </main>

            <!-- Footer -->
            {% include 'includes/footer.html' %}

        </div>

    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Charts.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>

    <!-- Scripts do sistema -->
    <script src="{{ url_for('static', filename='js/scripts.js') }}"></script>

    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/main.min.js"></script>

</body>
</html>
